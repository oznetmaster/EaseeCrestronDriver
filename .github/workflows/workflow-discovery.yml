name: Workflow discovery
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Discover exactly one offline processor workflow
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: workflow-discovery-discover-discover-exactly-one-offline-processor-workflow
