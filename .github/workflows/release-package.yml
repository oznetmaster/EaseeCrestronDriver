name: Release Package
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Original completed build run for immutable publication recovery
        type: string
      source_commit:
        description: Exact original source commit required with artifact_run_id
        type: string
      standard_release:
        description: Publish exact verified driver assets through the shared release actions
        type: boolean
        default: false
      public_version:
        description: Three-part public patch version for the shared release path
        type: string
      skip_desktop_checks:
        description: Reuse reviewed desktop results; package integrity checks still run
        required: false
        type: boolean
        default: false
      desktop_skip_reason:
        description: Tested source, completion time, frameworks, counts and evidence
        required: false
        type: string
      validation_commit:
        description: Reuse recent CI from an ancestor SHA with only docs or release-automation changes
        required: false
        type: string
      skip_hardware_checks:
        description: Reuse reviewed processor results or record unavailable hardware
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Tested source, completion time, results and cleanup or unavailability reason
        required: false
        type: string
      version:
        description: Three-part version matching the prepared manifests
        required: true
        type: string
      publish:
        description: Promote an already validated staging run from its exact existing release tag
        type: boolean
        default: false
      staged_run_id:
        description: Successful preparation run containing the exact validated Release assets; required for publication
        type: string
permissions:
  contents: read
concurrency:
  group: public-release
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: ${{ inputs.standard_release != true && (!inputs.publish) }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve prepared version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $selected = ./scripts/Get-DriverReleaseVersion.ps1 -ManifestPath EaseeCrestronDriver/EaseeCrestronDriver.json -Tag ('v'+$env:REQUESTED_VERSION) -RequireTag
          "version=$($selected.PackageVersion)" >> $env:GITHUB_OUTPUT
      - name: Require current hosted and App-reported processor checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["tests.yml","workflow-discovery.yml","nunit5-policy.yml"]'
        run: |
          Write-Output 'Configured checks are verified by the following shared-policy action.'
      - name: Verify shared release policy
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          required-checks: "${{ vars.RELEASE_REQUIRED_CHECKS }}"
          hosted-workflows: "[\"tests.yml\",\"workflow-discovery.yml\",\"nunit5-policy.yml\"]"
          skip-hardware-checks: "${{ inputs.skip_hardware_checks }}"
          hardware-skip-reason: "${{ inputs.hardware_skip_reason }}"
          skip-desktop-checks: "${{ inputs.skip_desktop_checks }}"
          desktop-skip-reason: "${{ inputs.desktop_skip_reason }}"
          validation-commit: "${{ inputs.validation_commit }}"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/checkout@v4
        with:
          repository: oznetmaster/CrestronHomeNUnit
          ref: d268167a15df665acfb4506a53d238cea833a42f
          path: .processor-sdk
          persist-credentials: false
      - name: Install pinned ILRepack
        run: dotnet tool install --global dotnet-ilrepack --version 2.0.45
      - name: Verify release guards and run offline tests
        shell: pwsh
        run: |
          ./.github/scripts/Test-RequiredReleaseChecks.ps1
          ./scripts/Test-ReleaseVersion.ps1
          ./scripts/Test-Offline.ps1
      - name: Build verified Release packages and NuGet distribution
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Stage-Release.ps1 -Version $env:RELEASE_VERSION -SdkRoot "$env:GITHUB_WORKSPACE/.processor-sdk"
      - name: Verify public driver artifact contents
        shell: pwsh
        run: |
          ./tools/Assert-PublicDriverArtifacts.ps1 -Path @("artifacts/release")
      - name: Stage verified public assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-offline-results
          path: TestResults/offline/*.trx
  promote:
    if: ${{ inputs.standard_release != true && (inputs.publish) }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact tag and successful preparation provenance
        id: validate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          STAGED_RUN_ID: ${{ inputs.staged_run_id }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:STAGED_RUN_ID -notmatch '^[0-9]+$'){throw 'Supply the successful staging run ID.'}
          $selected=./scripts/Get-DriverReleaseVersion.ps1 -ManifestPath EaseeCrestronDriver/EaseeCrestronDriver.json -Tag ('v'+$env:REQUESTED_VERSION) -RequireTag
          if($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -cne $selected.Tag){throw 'Publication requires the exact existing release tag.'}
          $head=(git rev-parse HEAD).Trim();$tagHead=(git rev-parse "$($selected.Tag)^{commit}").Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $tagHead){throw 'The release tag differs from this source.'}
          if((Get-Content RELEASE-NOTES.md -TotalCount 1) -cne ('# EaseeCrestronDriver '+$selected.PackageVersion)){throw 'Release notes are not prepared.'}
          $run=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:STAGED_RUN_ID" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or $run.head_sha -cne $head -or $run.path -cne '.github/workflows/release-package.yml' -or $run.event -cne 'workflow_dispatch' -or $run.conclusion -cne 'success'){throw 'Untrusted, failed or different-source preparation run.'}
          $jobs=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:STAGED_RUN_ID/jobs" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or @($jobs.jobs|Where-Object {$_.name -ceq 'prepare' -and $_.conclusion -ceq 'success'}).Count -ne 1){throw 'The selected run did not successfully build Release assets.'}
          gh run download $env:STAGED_RUN_ID --repo $env:GITHUB_REPOSITORY --name release-assets --dir artifacts/release
          if($LASTEXITCODE -ne 0){throw 'Cannot retrieve the selected preparation artifact.'}
          ./scripts/Assert-StagedRelease.ps1 -Directory artifacts/release -Version $selected.PackageVersion -Commit $head -BuildRunId $env:STAGED_RUN_ID
          "version=$($selected.PackageVersion)" >> $env:GITHUB_OUTPUT
          "tag=$($selected.Tag)" >> $env:GITHUB_OUTPUT
      - name: Require current source checks again before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["tests.yml","workflow-discovery.yml","nunit5-policy.yml"]'
        run: |
          Write-Output 'Configured checks are verified by the following shared-policy action.'
      - name: Verify shared release policy
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          required-checks: "${{ vars.RELEASE_REQUIRED_CHECKS }}"
          hosted-workflows: "[\"tests.yml\",\"workflow-discovery.yml\",\"nunit5-policy.yml\"]"
          skip-hardware-checks: "${{ inputs.skip_hardware_checks }}"
          hardware-skip-reason: "${{ inputs.hardware_skip_reason }}"
          skip-desktop-checks: "${{ inputs.skip_desktop_checks }}"
          desktop-skip-reason: "${{ inputs.desktop_skip_reason }}"
          validation-commit: "${{ inputs.validation_commit }}"
      - name: Verify public driver artifact contents
        shell: pwsh
        run: |
          ./tools/Assert-PublicDriverArtifacts.ps1 -Path @("artifacts/release")
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/release/*
          if-no-files-found: error
  publish-nuget:
    if: ${{ inputs.standard_release != true && (inputs.publish) }}
    needs: promote
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts/release
      - name: Verify public driver artifact contents
        shell: pwsh
        run: |
          ./tools/Assert-PublicDriverArtifacts.ps1 -Path @("artifacts/release")
      - name: Authenticate to NuGet using GitHub OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the verified distribution wrapper
        shell: pwsh
        env:
          NUGET_TEMP_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: ./scripts/Publish-DriverNuGet.ps1 -Directory artifacts/release -Version $env:RELEASE_VERSION
  publish:
    if: ${{ inputs.standard_release != true && (inputs.publish) }}
    needs: [promote, publish-nuget]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts/release
      - name: Verify public driver artifact contents
        shell: pwsh
        run: |
          ./tools/Assert-PublicDriverArtifacts.ps1 -Path @("artifacts/release")
      - name: Publish the already verified GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          extra=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --title "EaseeCrestronDriver $RELEASE_VERSION" --notes-file RELEASE-NOTES.md "${extra[@]}"

  build:
    if: inputs.standard_release == true && inputs.artifact_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install pinned merge tool
        shell: pwsh
        run: dotnet tool install --global dotnet-ilrepack --version 2.0.45
      - uses: oznetmaster/BuildAutomation/.github/actions/release-prepare@d0973220540fa9a04e614d7f2a3f5e12e531b680
        with:
          version: ${{ inputs.public_version }}
      - name: Verify shared validation policy
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          required-checks: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          hosted-workflows: '["tests.yml","workflow-discovery.yml","nunit5-policy.yml"]'
          skip-desktop-checks: ${{ inputs.skip_desktop_checks }}
          desktop-skip-reason: ${{ inputs.desktop_skip_reason }}
          skip-hardware-checks: ${{ inputs.skip_hardware_checks }}
          hardware-skip-reason: ${{ inputs.hardware_skip_reason }}
          validation-commit: ${{ inputs.validation_commit }}
      - name: Stage driver packages through Cake
        uses: oznetmaster/BuildAutomation@d0973220540fa9a04e614d7f2a3f5e12e531b680
        env:
          RELEASE_VERSION: ${{ inputs.public_version }}
        with:
          task: release-assets
      - uses: oznetmaster/BuildAutomation/.github/actions/release-freeze@d0973220540fa9a04e614d7f2a3f5e12e531b680
        with:
          version: ${{ inputs.public_version }}
  standard-publish:
    if: inputs.standard_release == true && inputs.artifact_run_id == ''
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: oznetmaster/BuildAutomation/.github/actions/release-publish@d0973220540fa9a04e614d7f2a3f5e12e531b680
        with:
          version: ${{ inputs.public_version }}
  recover-frozen:
    if: inputs.standard_release == true && inputs.artifact_run_id != ''
    runs-on: windows-latest
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: oznetmaster/BuildAutomation/.github/actions/release-publish@d0973220540fa9a04e614d7f2a3f5e12e531b680
        with:
          version: ${{ inputs.public_version }}
          source-run-id: ${{ inputs.artifact_run_id }}
          source-commit: ${{ inputs.source_commit }}