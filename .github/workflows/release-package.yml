name: Release Package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Three-part release matching the manifest, with an optional prerelease suffix
        required: true
        type: string
      publish:
        description: Publish GitHub release assets; requires checkout of the exact existing release tag
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: easee-driver-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release and exact tag
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { 'v' + ($env:REQUESTED_VERSION -replace '^v','') }
          $selected = ./scripts/Get-DriverReleaseVersion.ps1 -ManifestPath EaseeCrestronDriver/EaseeCrestronDriver.json -Tag $tag -RequireTag
          if ($env:PUBLISH -eq 'true') {
            if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -cne $selected.Tag) { throw 'Publication requires checkout of the exact existing release tag.' }
            $tagCommit = git rev-parse "$($selected.Tag)^{commit}"
            $head = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $head) { throw 'Release tag does not identify this source.' }
            $heading = '# EaseeCrestronDriver ' + $selected.PackageVersion
            if ((Get-Content RELEASE-NOTES.md -TotalCount 1) -cne $heading) { throw 'Prepare release notes for this version before publication.' }
          }
          "version=$($selected.PackageVersion)" >> $env:GITHUB_OUTPUT
          "tag=$($selected.Tag)" >> $env:GITHUB_OUTPUT
      - name: Require current hosted and App-reported processor checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["tests.yml","workflow-discovery.yml"]'
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REQUIRED_RELEASE_CHECKS)) { throw 'Configure the processor-check release gate before using this workflow.' }
          ./.github/scripts/Wait-RequiredReleaseChecks.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/checkout@v4
        with:
          repository: oznetmaster/CrestronHomeNUnit
          ref: d268167a15df665acfb4506a53d238cea833a42f
          path: .processor-sdk
          persist-credentials: false
      - name: Install pinned ILRepack
        run: dotnet tool install --global dotnet-ilrepack --version 2.0.45
      - name: Verify release guard behavior
        shell: pwsh
        run: |
          ./.github/scripts/Test-RequiredReleaseChecks.ps1
          ./scripts/Test-ReleaseVersion.ps1
      - name: Run offline tests
        shell: pwsh
        run: ./scripts/Test-Offline.ps1
      - name: Build and verify driver/test packages and documents
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Stage-Release.ps1 -Version $env:RELEASE_VERSION -SdkRoot "$env:GITHUB_WORKSPACE/.processor-sdk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-offline-results
          path: TestResults/offline/*.trx
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: prepare
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts/release
      - name: Publish the already verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --title "EaseeCrestronDriver $RELEASE_VERSION" --notes-file RELEASE-NOTES.md
