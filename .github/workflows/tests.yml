name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test shared driver versioning policy
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: driver-versioning-regressions
          root: .
      - name: Test public driver packaging policy
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: public-driver-packaging-regressions
          root: .
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test release guards
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-test-test-release-guards
      - name: Run offline NUnit 5 suites
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-test-run-offline-nunit-5-suites
      - name: Build desktop validation tooling
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-test-build-desktop-validation-tooling
      - name: Build Android fixture harness without running it
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-test-build-android-fixture-harness-without-running-it
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-results
          path: TestResults/offline/*.trx
          if-no-files-found: error
